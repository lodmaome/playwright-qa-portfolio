# Actions are pinned to major-version tags for readability. For a stronger
# supply-chain guarantee, pin each `uses:` to a full commit SHA instead.
name: Update Visual Snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - name: Update snapshots
        env:
          UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
          STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
          LOCKED_USERNAME: ${{ secrets.LOCKED_USERNAME }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: npx playwright test --project=visual --update-snapshots --workers=4

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-snapshots
          path: tests/ui/**/*.png

  open-pr:
    needs: update-snapshots
    if: needs.update-snapshots.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: playwright-snapshots
          path: tests/ui

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/update-visual-baselines
          commit-message: "test: update Linux visual baselines"
          title: "test: update Linux visual baselines"
          body: |
            Regenerated by the `Update Visual Snapshots` workflow on the Linux runner.
            Only `*-visual-linux.png` files are included. Review the image diffs before merging.
          add-paths: tests/ui/**/*-visual-linux.png
          delete-branch: true
